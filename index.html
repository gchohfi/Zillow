<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orlando Land Detector - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 30px; background: #f8f9fa; }
        .summary-card { background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #667eea; text-align: center; }
        .summary-card.viable { border-left-color: #10b981; }
        .summary-card.radar { border-left-color: #f59e0b; }
        .summary-card h3 { font-size: 0.9em; color: #666; }
        .summary-card .value { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .summary-card.viable .value { color: #10b981; }
        .summary-card.radar .value { color: #f59e0b; }
        .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 30px; }
        .section { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); overflow: hidden; }
        .section-header { background: #f8f9fa; padding: 20px; border-bottom: 2px solid #e0e0e0; }
        .section-header h2 { font-size: 1.3em; color: #333; }
        .section-content { padding: 20px; }
        #map { width: 100%; height: 500px; }
        table { width: 100%; border-collapse: collapse; }
        table th { padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0; cursor: pointer; }
        table td { padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .status-viable { background: #d1fae5; color: #065f46; }
        .status-radar { background: #fef3c7; color: #78350f; }
        .status-rejected { background: #fee2e2; color: #7f1d1d; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: 2px solid #e0e0e0; background: white; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .filter-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .full-width { grid-column: 1 / -1; }
        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-map-marked-alt"></i> Orlando Land Detector</h1>
            <p>Real-time dashboard for property opportunities in the Orlando market</p>
        </header>

        <div class="summary">
            <div class="summary-card">
                <h3>Total Opportunities</h3>
                <div class="value" id="totalCount">-</div>
            </div>
            <div class="summary-card viable">
                <h3>Viable Properties</h3>
                <div class="value" id="viableCount">-</div>
            </div>
            <div class="summary-card radar">
                <h3>In Radar</h3>
                <div class="value" id="radarCount">-</div>
            </div>
            <div class="summary-card">
                <h3>New in 24h</h3>
                <div class="value" id="newCount">-</div>
            </div>
            <div class="summary-card">
                <h3>Best Margin</h3>
                <div class="value" id="bestMargin">-</div>
            </div>
            <div class="summary-card">
                <h3>Last Capture</h3>
                <div class="value" id="lastCapture">-</div>
            </div>
        </div>

        <div class="main-content">
            <div class="section">
                <div class="section-header">
                    <h2><i class="fas fa-map"></i> Property Locations</h2>
                </div>
                <div id="map"></div>
            </div>

            <div class="section full-width">
                <div class="section-header">
                    <h2><i class="fas fa-table"></i> Opportunities</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="viable">Viável</button>
                        <button class="filter-btn" data-filter="radar">Radar</button>
                        <button class="filter-btn" data-filter="rejected">Reprovada</button>
                    </div>
                </div>
                <div class="section-content">
                    <table id="opportunitiesTable">
                        <thead>
                            <tr>
                                <th data-column="date">Date</th>
                                <th data-column="address">Address</th>
                                <th data-column="margin">Margin %</th>
                                <th data-column="profit">Profit</th>
                                <th data-column="status">Status</th>
                                <th data-column="arv">ARV</th>
                                <th data-column="price">Price</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
